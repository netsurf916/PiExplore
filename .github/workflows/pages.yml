name: Deploy PiExplore to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PARI reference file
        run: |
          test "$(wc -c < pi-pari-5m.txt)" -eq 5000000
          test "$(LC_ALL=C tr -cd '0-9' < pi-pari-5m.txt | wc -c)" -eq 5000000

      - name: Restore verified pi seed
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: .pi-seed-cache
          key: pi-seed-${{ runner.os }}-mpmath-1.3.0-${{ hashFiles('pi-pari-5m.txt', 'tools/generate_pi_seed.py') }}

      - name: Set up Python
        if: steps.seed-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify PARI corpus against mpmath and package seed
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --disable-pip-version-check "mpmath==1.3.0"
          rm -rf .pi-seed-cache
          mkdir -p .pi-seed-cache/data
          python tools/generate_pi_seed.py \
            --reference pi-pari-5m.txt \
            --digits 5000000 \
            --chunk-size 1000000 \
            --output-dir .pi-seed-cache/data

      - name: Show verified corpus manifest
        run: cat .pi-seed-cache/data/manifest.json

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css .nojekyll _site/
          cp .pi-seed-cache/data/* _site/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
