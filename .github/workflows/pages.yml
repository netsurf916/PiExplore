name: Deploy PiExplore to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate gzip container
        run: gzip -t pi-pari-50m.txt.gz

      - name: Validate and package local pi corpus
        run: |
          rm -rf _site
          mkdir -p _site/data
          python3 tools/package_pi_corpus.py \
            --corpus pi-pari-50m.txt.gz \
            --verified-prefix pi-pari-5m.txt \
            --digits 50000000 \
            --chunk-size 1000000 \
            --output-dir _site/data

      - name: Show corpus manifest
        run: cat _site/data/manifest.json

      - name: Assemble static site
        run: cp index.html app.js styles.css .nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
