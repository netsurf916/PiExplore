name: Deploy PiExplore to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore generated pi seed
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: .pi-seed-cache
          key: pi-seed-${{ runner.os }}-5000000-${{ hashFiles('tools/generate_pi_seed.py') }}

      - name: Set up Python
        if: steps.seed-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate first 5 million digits
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --disable-pip-version-check "mpmath==1.3.0"
          mkdir -p .pi-seed-cache/data
          python tools/generate_pi_seed.py \
            --digits 5000000 \
            --chunk-size 1000000 \
            --output-dir .pi-seed-cache/data

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css .nojekyll _site/
          cp .pi-seed-cache/data/* _site/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
