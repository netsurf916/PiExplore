<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Pi Explore</title>
  <link rel="stylesheet" href="styles.css?v=local50m-r8">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <div class="pi-mark">π</div>
      <div>
        <h1>Pi Explore</h1>
        <p>Turn the digits of π into color.</p>
      </div>
    </div>

    <form id="controls" class="controls">
      <div class="control-field start-field">
        <span class="control-label">Start index</span>
        <div class="stepper">
          <button type="button" id="startDecrement" class="stepper-button" aria-label="Decrease start index by 1" title="Start index −1">−</button>
          <input id="startInput" name="start" inputmode="numeric" value="0" autocomplete="off" aria-label="Start index">
          <button type="button" id="startIncrement" class="stepper-button" aria-label="Increase start index by 1" title="Start index +1">+</button>
        </div>
      </div>
      <div class="control-field width-field">
        <span class="control-label">Width</span>
        <div class="stepper">
          <button type="button" id="widthDecrement" class="stepper-button" aria-label="Decrease width by 1" title="Width −1">−</button>
          <input id="widthInput" name="width" type="number" min="1" max="2000" step="1" value="100" aria-label="Width">
          <button type="button" id="widthIncrement" class="stepper-button" aria-label="Increase width by 1" title="Width +1">+</button>
        </div>
      </div>
      <label class="mode-field">
        <span>Mode</span>
        <select id="modeSelect" name="mode" aria-label="Rendering mode">
          <option value="palette">Digit palette</option>
          <option value="intensity1">1 digit → intensity</option>
          <option value="intensity2">2 digits → intensity</option>
          <option value="rgb3">3 digits → RGB</option>
          <option value="rgb6">6 digits → RRGGBB</option>
          <option value="difference">Difference</option>
        </select>
      </label>
      <label id="channelField" class="channel-field">
        <span>Channel</span>
        <select id="channelSelect" name="channel" aria-label="Intensity color channel">
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue" selected>Blue</option>
        </select>
      </label>
      <button type="submit" class="primary">Render</button>
      <div class="nav-stepper" role="group" aria-label="Move through pi">
        <button type="button" id="homeButton" class="nav-home" aria-label="Go to start of pi" title="Go to index 0">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 11.5 12 4l9 7.5M5.5 10v9h5v-5h3v5h5v-9"></path>
          </svg>
        </button>
        <button type="button" id="prevButton" aria-label="Previous page" title="Previous whole page">&lt;&lt;&lt;&lt;</button>
        <button type="button" id="prevHalfButton" aria-label="Previous half page" title="Previous half page">&lt;&lt;&lt;</button>
        <button type="button" id="prevTenRowsButton" aria-label="Previous 10 rows" title="Previous 10 rows">&lt;&lt;</button>
        <button type="button" id="prevRowButton" aria-label="Previous row" title="Previous 1 row">&lt;</button>
        <button type="button" id="nextRowButton" aria-label="Next row" title="Next 1 row">&gt;</button>
        <button type="button" id="nextTenRowsButton" aria-label="Next 10 rows" title="Next 10 rows">&gt;&gt;</button>
        <button type="button" id="nextHalfButton" aria-label="Next half page" title="Next half page">&gt;&gt;&gt;</button>
        <button type="button" id="nextButton" aria-label="Next page" title="Next whole page">&gt;&gt;&gt;&gt;</button>
      </div>
    </form>

    <div class="palette-wrap">
      <span class="palette-label">Digit colors</span>
      <div id="palette" class="palette" aria-label="Digit color palette"></div>
      <button id="resetPalette" class="subtle" type="button">Reset</button>
    </div>
  </header>

  <main>
    <section id="visualizer" class="visualizer" aria-label="Pi digit visualization">
      <canvas id="piCanvas"></canvas>
      <div id="emptyState" class="empty-state">Loading digits of π…</div>

      <aside id="magnifier" class="magnifier" hidden>
        <div class="magnifier-heading">
          <strong id="magnifierIndex">index 0</strong>
          <span id="magnifierDigit">digit 3</span>
        </div>
        <canvas id="magnifierCanvas" width="338" height="234"></canvas>
      </aside>
    </section>
  </main>

  <footer class="statusbar">
    <div id="status">Ready.</div>
    <div id="range"></div>
    <div class="build" title="Deployed UI build">local50m-r8</div>
    <a href="https://github.com/netsurf916/PiExplore" target="_blank" rel="noreferrer">GitHub</a>
  </footer>

  <script src="app.js?v=local50m-r8"></script>
</body>
</html>
